# Local Development Profile (H2 Database)
spring:
  datasource:
    #    driver-class-name: org.h2.Driver
    #    url: jdbc:h2:file:./data/duit;MODE=MySQL;AUTO_SERVER=TRUE
    #    username: sa
    #    password:

    # local mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${LOCAL_DB_PORT}/${DB_NAME}?rewriteBatchedStatements=true&allowLoadLocalInfile=true&useServerPrepStmts=false&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  flyway:
    # ⚠️ local 은 SSH 터널(3308) 반대편이 "운영 MySQL" 이다.
    #    Flyway 를 켜둔 채 앱을 띄우면 미적용 마이그레이션이 운영 스키마에 그대로 적용된다.
    #    그래서 기본값 off. 마이그레이션 검증은 일회용 컨테이너로 할 것:
    #      docker run -d --name mig-check -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=duit mysql:8.0
    #    로컬 전용 DB 를 따로 띄운 경우에만 LOCAL_FLYWAY_ENABLED=true 로 켠다.
    enabled: ${LOCAL_FLYWAY_ENABLED:false}
    # 로컬 개발 편의: 마이그레이션 실패 row 를 다음 기동 시 자동 정리. prod 에는 적용 X (수동 검토)
    repair-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway 가 스키마 권한. JPA 는 entity↔DB 검증만
    show-sql: false
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.H2Dialect
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000

# 파일 스토리지 설정 (로컬)
file:
  upload-dir: C:/temp/duit-uploads
  base-url: http://localhost:8080
