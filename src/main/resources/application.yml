spring:
  profiles:
    active: ${PROFILE}

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 3000
      # 풀 커넥션을 autocommit=false 로 둔다. Boot 가 이를 보고 Hibernate 의 provider_disables_autocommit 을 자동으로 켜서
      # 트랜잭션마다 보내던 SET autocommit 왕복이 사라진다. 쓰기는 반드시 @Transactional 안에서 (밖에서 쓴 JDBC 는 커밋되지 않는다)
      auto-commit: false

  jpa:
    open-in-view: false  # OSIV 비활성화 — 컨트롤러에서 Lazy Loading 방지, 커넥션 풀 점유 최소화
    properties:
      # 커넥션을 첫 SQL 에서 잡고 트랜잭션 끝에 반납 → SQL 이 없는 트랜잭션(캐시 히트)은 커넥션을 잡지 않는다.
      # 이 모드에선 @Transactional(isolation=…) 을 쓸 수 없다(InvalidIsolationLevelException). provider_disables_autocommit 은 직접 쓰지 말 것.
      # 근거·측정: performance/decisions.md D-016
      hibernate.connection.handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

  # Flyway 스키마 마이그레이션 — prod/local 에서 활성, test 는 application-test.yml 에서 비활성화
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 운영 DB에 첫 적용 시 baseline 자동 생성
    baseline-version: 0
    locations: classpath:db/migration

  # 파일 업로드 크기 제한 설정
  servlet:
    multipart:
      max-file-size: 10MB      # 개별 파일 최대 크기
      max-request-size: 20MB   # 전체 요청 최대 크기

  output:
    ansi:
      enabled: always

  # Jackson 설정
  jackson:
    serialization:
      indent-output: false  # 들여쓰기 출력은 요청 스레드 CPU 2.6% + 응답 바이트. 클라이언트는 전부 JSON 파서 (performance D-019)
    time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus  # 배포 헬스체크(health)와 Prometheus 수집(prometheus)에 쓰는 엔드포인트만 노출
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_VALIDITY}

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
  cache:
    disabled: false  # 캐시 활성화
  enable-kotlin: true

discord:
  webhook:
    alarm:
      url: ${DISCORD_ALARM_WEBHOOK_URL}
    error-monitoring:
      url: ${DISCORD_ERROR_WEBHOOK_URL}

# Firebase 설정
firebase:
  web-api-key: ${FIREBASE_WEB_API_KEY}
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-json: ${FIREBASE_KEY_JSON}

api:
  saramin:
    access-key: ${SARAMIN_ACCESS_KE:}
  work24:
    auth-key: ${WORK24_KEY}
    # 목록 페이지 수집 상한 (0 또는 미지정 = 전체) — 테스트 시 1로 제한
    list-page-limit: ${WORK24_LIST_PAGE_LIMIT:0}
    # 상세 API 호출 상한 (0 또는 미지정 = 전체) — 테스트 시 100으로 제한
    detail-limit: ${WORK24_DETAIL_LIMIT:0}