spring:
  profiles:
    active: ${PROFILE}

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 3000

  jpa:
    open-in-view: false  # OSIV 비활성화 — 컨트롤러에서 Lazy Loading 방지, 커넥션 풀 점유 최소화

  # Flyway 스키마 마이그레이션 — prod/local 에서 활성, test 는 application-test.yml 에서 비활성화
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 운영 DB에 첫 적용 시 baseline 자동 생성
    baseline-version: 0
    locations: classpath:db/migration

  # 파일 업로드 크기 제한 설정
  servlet:
    multipart:
      max-file-size: 10MB      # 개별 파일 최대 크기
      max-request-size: 20MB   # 전체 요청 최대 크기

  output:
    ansi:
      enabled: always

  # Jackson 설정
  jackson:
    serialization:
      indent-output: true
    time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        # 헬스체크(배포 스크립트·docker)와 Prometheus 스크랩만 노출
        include: "health,prometheus"
      # /actuator 엔드포인트 목록 페이지는 쓰지 않으므로 끈다
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Prometheus 스크랩용 Bearer 토큰 — 비어 있으면 /actuator/prometheus 요청을 모두 거부
metrics:
  token: ${METRICS_TOKEN:}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_VALIDITY}

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
  cache:
    disabled: false  # 캐시 활성화
  enable-kotlin: true

discord:
  webhook:
    alarm:
      url: ${DISCORD_ALARM_WEBHOOK_URL}
    error-monitoring:
      url: ${DISCORD_ERROR_WEBHOOK_URL}

# Firebase 설정
firebase:
  web-api-key: ${FIREBASE_WEB_API_KEY}
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-json: ${FIREBASE_KEY_JSON}

api:
  saramin:
    access-key: ${SARAMIN_ACCESS_KE:}
  work24:
    auth-key: ${WORK24_KEY}
    # 목록 페이지 수집 상한 (0 또는 미지정 = 전체) — 테스트 시 1로 제한
    list-page-limit: ${WORK24_LIST_PAGE_LIMIT:0}
    # 상세 API 호출 상한 (0 또는 미지정 = 전체) — 테스트 시 100으로 제한
    detail-limit: ${WORK24_DETAIL_LIMIT:0}
    # 임금체불 명단공개 사업주 조회 API 키 — 비어 있으면 auth-key 를 쓰고, 둘 다 없으면 조회하지 않음
    wage-defaulter:
      auth-key: ${WORK24_WAGE_DEFAULTER_KEY:}