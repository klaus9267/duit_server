# Production Profile (MySQL Database)
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 준비문 캐시: 없으면 Connector/J 가 SQL 마다 문자열을 다시 파싱한다(요청 스레드 CPU 9.3%). 로컬과 같은 값 — DataSourceUrlParityTest
    # prepStmtCacheSqlLimit 2048: Hibernate SQL 은 길어서(채용 본문 조회 컬럼 40여 개) 기본값 256자로는 캐시되지 않는다. 근거: performance/decisions.md D-019
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: redis
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway 가 스키마 권한. JPA 는 entity↔DB 검증만
    show-sql: false  # SQL 로그 비활성화
    properties:
      hibernate:
        # dialect removed — Spring Boot 3+ auto-detects MySQL8
        default_batch_fetch_size: 100
        format_sql: false
        use_sql_comments: false

# 파일 스토리지 설정 (프로덕션)
file:
  upload-dir: ${UPLOAD_DIR}
  base-url: ${BASE_URL}
